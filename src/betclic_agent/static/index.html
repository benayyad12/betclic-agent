<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BetclicAgent — matchs du jour</title>
<style>
  :root {
    --bg: #0b0f1a;
    --surface: #131a2a;
    --surface-2: #1a2338;
    --line: #242f48;
    --text: #e8ecf5;
    --muted: #8b96b0;
    --accent: #ffd21f;
    --accent-ink: #14140a;
    --live: #ff4d5e;
    --good: #22c55e;
    --mid: #f5a524;
    --bad: #ef4444;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header.top { position: sticky; top: 0; z-index: 10; background: rgba(11,15,26,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top-row { display: flex; align-items: center; gap: 14px; padding: 12px 20px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .5px; font-size: 16px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  .logo { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font-style: normal; font-weight: 900; }
  .search { flex: 1; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; }
  .search::placeholder { color: var(--muted); }
  .top-controls { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  select, input[type=date] { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  .live-pill { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(34,197,94,.6); animation: pulse 1.8s infinite; }
  .dot.off { background: var(--muted); animation: none; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

  nav.sports { display: flex; gap: 4px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
  nav.sports button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 600; }
  nav.sports button:hover { color: var(--text); }
  nav.sports button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }

  .days { display: flex; gap: 8px; padding: 14px 20px; overflow-x: auto; scrollbar-width: none; }
  .chip { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; padding: 0 20px 40px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .list { padding: 6px 0; min-height: 320px; }
  .summary { display: flex; gap: 10px; flex-wrap: wrap; padding: 14px 16px; color: var(--muted); font-size: 12px; border-bottom: 1px solid var(--line); }
  .summary b { color: var(--text); font-size: 14px; }
  .summary .stat { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; }

  .section-title { padding: 14px 16px 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .section-title.live { color: var(--live); }
  .section-title.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
  .comp { padding: 10px 16px 4px; font-weight: 700; color: var(--text); font-size: 13px; }

  .row { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto 18px; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; background: none; border: 0; border-top: 1px solid var(--line); cursor: pointer; text-align: left; color: var(--text); }
  .teams-stack { display: grid; gap: 4px; min-width: 0; }
  .team { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
  .team + .team { color: var(--muted); font-weight: 500; }
  .odds-tiles { display: grid; gap: 6px; margin: 10px 0 4px; }
  .odds-tiles button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; color: var(--text); cursor: default; }
  .odds-tiles .o-label { color: var(--muted); font-size: 11px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .odds-tiles .o-value { color: var(--accent); font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
  .row:hover { background: var(--surface-2); }
  .row[aria-current="true"] { background: var(--surface-2); box-shadow: inset 3px 0 0 var(--accent); }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
  .teams { min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
  .status.in_play { background: rgba(255,77,94,.15); color: var(--live); }
  .status.upcoming { background: rgba(255,210,31,.12); color: var(--accent); }
  .chev { color: var(--muted); text-align: center; }
  .diffusion { margin-left: 6px; font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--accent); color: var(--accent-ink); font-weight: 700; vertical-align: middle; }

  aside.analysis { position: sticky; top: 184px; padding: 16px; max-height: calc(100vh - 200px); overflow-y: auto; }
  .placeholder { color: var(--muted); padding: 30px 6px; text-align: center; }
  .placeholder .big { font-size: 34px; margin-bottom: 8px; }
  .an-head { margin-bottom: 12px; }
  .an-title { font-size: 17px; font-weight: 800; }
  .an-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .an-summary { border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; border: 1px solid var(--line); background: var(--surface-2); }
  .an-summary.good { border-color: var(--good); }
  .an-summary.mid { border-color: var(--mid); }
  .an-summary.bad { border-color: var(--bad); }
  .an-sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .an-card { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; }
  .an-card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .an-market { font-weight: 700; }
  .an-verdict { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .an-verdict.good { background: rgba(34,197,94,.15); color: var(--good); }
  .an-verdict.mid { background: rgba(245,165,36,.15); color: var(--mid); }
  .an-verdict.bad { background: rgba(239,68,68,.15); color: var(--bad); }
  .an-verdict.neutral { background: var(--line); color: var(--muted); }
  .an-margin { color: var(--muted); font-size: 12px; margin: 6px 0 8px; }
  .an-row { margin-top: 10px; }
  .an-line { display: flex; justify-content: space-between; gap: 8px; }
  .an-out { font-weight: 600; }
  .an-odds { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
  .an-bar { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 6px 0; }
  .an-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), #ffb020); border-radius: 999px; transition: width .4s ease; }
  .an-chances { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
  .an-chances b { color: var(--text); }
  details.an-more { color: var(--muted); font-size: 12px; margin-top: 10px; }
  details.an-more summary { cursor: pointer; }
  .legend { color: var(--muted); font-size: 11px; margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }

  .skeleton { display: grid; gap: 8px; padding: 12px 16px; }
  .skeleton div { height: 52px; border-radius: 10px; background: linear-gradient(90deg, var(--surface-2) 25%, var(--line) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .msg { color: var(--muted); padding: 24px 16px; text-align: center; }
  .err { color: var(--bad); padding: 12px 16px; }
  .banner { margin: 0 16px 10px; padding: 8px 12px; border-radius: 8px; background: rgba(245,165,36,.12); color: var(--mid); font-size: 12px; }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  @media (max-width: 960px) {
    header.top { position: static; }
    main { grid-template-columns: 1fr; }
    aside.analysis { position: static; max-height: none; }
    .top-row { flex-wrap: wrap; padding: 10px 14px; }
    .search { max-width: none; order: 3; flex-basis: 100%; }
    .top-controls { margin-left: 0; flex-wrap: wrap; }
    nav.sports, .days { padding-left: 14px; padding-right: 14px; }
    main { padding: 0 14px 30px; }
    .row { grid-template-columns: 48px minmax(0, 1fr) auto 12px; gap: 8px; padding: 10px 12px; }
    .teams { white-space: normal; }
    .diffusion { white-space: nowrap; }
  }
  .an-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .an-tab { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .an-tab.active { color: var(--text); border-color: var(--accent, #4f8cff); }
  .an-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; }
  .an-table th, .an-table td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
  .an-table th { color: var(--muted); font-weight: 500; }
  .na { color: var(--muted); font-style: italic; }
  .an-tiles { display: grid; gap: 8px; margin: 10px 0; }
  .an-tile { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; text-align: center; font-size: 12px; }
  .an-tile b { display: block; font-size: 18px; }
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><i class="logo">B</i><span class="brand-text">BETCLIC <span>AI</span></span></div>
    <input class="search" type="search" id="search" placeholder="Rechercher une équipe ou un tournoi…" aria-label="Rechercher">
    <div class="top-controls">
      <a href="/engine" class="btn-link" style="align-self:center;color:var(--muted);font-size:12px">Centre du jour →</a>
      <select id="market" aria-label="Marché">
        <option value="">Marché : défaut</option>
        <option value="CI">CI</option>
        <option value="FR">FR</option>
        <option value="SN">SN</option>
      </select>
      <input type="date" id="day" aria-label="Choisir un jour">
      <span class="live-pill" id="live"><span class="dot off" id="dot"></span><span id="ago">en attente</span></span>
    </div>
  </div>
  <nav class="sports" role="tablist" aria-label="Sports" id="sports">
    <button role="tab" data-sport="football" aria-selected="true">⚽ Football</button>
    <button role="tab" data-sport="basketball" aria-selected="false">🏀 Basketball</button>
    <button role="tab" data-sport="tennis" aria-selected="false">🎾 Tennis</button>
    <button role="tab" data-sport="rugby" aria-selected="false">🏉 Rugby</button>
  </nav>
  <div class="days" id="days" role="group" aria-label="Jour"></div>
</header>

<main>
  <section class="panel" aria-live="polite">
    <div class="summary" id="summary">Chargement des matchs…</div>
    <div class="list" id="list"></div>
  </section>
  <aside class="panel analysis" id="analysis" aria-label="Analyse du match">
    <div class="placeholder"><div class="big">📊</div>Cliquez sur un match pour voir ses cotes, sa marge et les chances selon les cotes.</div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
const SPORT_LABEL = { football: "Football", basketball: "Basketball", tennis: "Tennis", rugby: "Rugby" };
const STATUS_LABEL = { in_play: "En cours", upcoming: "À venir", past: "Terminé", unknown: "Heure ?" };
const STATUS_ORDER = ["in_play", "upcoming", "past", "unknown"];
const REFRESH_MS = 15000;
const ANALYSIS_MS = 15000;
let analysisTimer = null;
const PLACEHOLDER = `<div class="placeholder"><div class="big">📊</div>Cliquez sur un match pour voir ses cotes, sa marge et les chances selon les cotes.</div>`;

const state = {
  sport: "football",
  day: new Date().toISOString().substring(0, 10),
  market: "",
  matches: [],
  signature: "",
  analysisSig: "",
  analysisAt: "",
  receivedAt: 0,
  selectedId: null,
  seq: 0,
  analysisSeq: 0,
};

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function hhmm(iso) {
  if (!iso) return "--:--";
  const d = new Date(iso);
  return isNaN(d) ? "--:--" : d.toISOString().substring(11, 16);
}

function shiftDay(base, offset) {
  const d = new Date(base + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + offset);
  return d.toISOString().substring(0, 10);
}

async function getJson(url) {
  const r = await fetch(url);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || `Erreur HTTP ${r.status}`);
  return body;
}

function renderDays() {
  const today = new Date().toISOString().substring(0, 10);
  const labels = { "-1": "Hier", "0": "Aujourd'hui", "1": "Demain" };
  let html = "";
  for (const off of [-1, 0, 1, 2]) {
    const iso = shiftDay(today, off);
    const label = labels[off] ?? new Date(iso + "T00:00:00Z").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short", timeZone: "UTC" });
    html += `<button class="chip" data-day="${iso}" aria-pressed="${iso === state.day}">${esc(label)}</button>`;
  }
  $("days").innerHTML = html;
}

function signatureOf(data) {
  return [state.sport, data.day, data.market, ...data.matches.map(m => `${m.id}|${m.status}|${m.live_stream}|${m.date}|${m.name}`)].join(";");
}

async function refresh({ silent = false } = {}) {
  const seq = ++state.seq;
  if (!silent && !state.matches.length) {
    $("list").innerHTML = `<div class="skeleton" aria-hidden="true"><div></div><div></div><div></div><div></div><div></div></div>`;
  }
  try {
    const params = new URLSearchParams({ date: state.day });
    if (state.market) params.set("market", state.market);
    const data = await getJson(`/api/today/${encodeURIComponent(state.sport)}?${params}`);
    if (seq !== state.seq) return;
    handleData(data);
  } catch (e) {
    if (seq !== state.seq) return;
    $("dot").classList.add("off");
    if (!state.matches.length) $("list").innerHTML = `<div class="err">${esc(e.message)}</div>`;
    else $("summary").insertAdjacentHTML("beforeend", `<span class="err">⚠ Mise à jour impossible : ${esc(e.message)}</span>`);
  }
}

function applyData(data) {
  state.receivedAt = Date.now();
  state.matches = data.matches;
  // Ne re-rend la liste que si quelque chose a changé : évite le clignotement à chaque actualisation.
  const sig = signatureOf(data);
  if (sig !== state.signature) {
    state.signature = sig;
    renderList();
  }
  renderSummary(data);
}

// Snapshot local : la page s'affiche tout de suite avec les dernières données, le temps que Betclic réponde.
const SNAP_KEY = "betclic-snapshot";
function snapKey() { return `${state.sport}|${state.day}|${state.market}`; }
function loadSnapshot() {
  try {
    const snap = JSON.parse(localStorage.getItem(SNAP_KEY) || "null");
    if (snap && snap.key === snapKey() && snap.data) applyData(snap.data);
  } catch (_) {}
}

function renderSummary(data) {
  const s = data.source;
  const when = s.fetched_at ? new Date(s.fetched_at).toISOString().substring(11, 19) + " UTC" : "—";
  const c = data.counts;
  const warn = s.complete ? "" : `<div class="banner" style="flex-basis:100%">⚠ Résultats partiels : ${s.failed_pages} page(s) sur ${s.pages} n'ont pas répondu. La prochaine mise à jour les complètera.</div>`;
  $("summary").innerHTML =
    `<span class="stat"><b>${data.matches.length}</b> matchs</span>` +
    `<span class="stat"><b>${c.in_play}</b> en cours (estimé)</span>` +
    `<span class="stat"><b>${c.upcoming}</b> à venir</span>` +
    `<span class="stat">${esc(SPORT_LABEL[state.sport])} • ${esc(data.day)} • données à ${when}${s.from_cache ? " (cache)" : ""}</span>` +
    warn;
}

// Affiche « Équipe A » et « Équipe B » sur deux lignes, comme sur Betclic.
function teamLines(name) {
  const parts = String(name ?? "").split(/\s+-\s+|\s+vs\s+/i);
  if (parts.length < 2) return `<span class="team">${esc(name)}</span>`;
  return `<span class="team">${esc(parts[0])}</span><span class="team">${esc(parts.slice(1).join(" - "))}</span>`;
}

function renderList() {
  const list = $("list");
  const q = $("search").value.trim().toLowerCase();
  const items = q ? state.matches.filter(m => `${m.name} ${m.competition}`.toLowerCase().includes(q)) : state.matches;
  if (!items.length) {
    list.innerHTML = `<div class="msg">${state.matches.length ? "Aucun match pour cette recherche." : "Aucun match ce jour-là."}</div>`;
    return;
  }
  let html = "";
  for (const status of STATUS_ORDER) {
    const group = items.filter(m => m.status === status);
    if (!group.length) continue;
    const title = status === "in_play" ? "En cours (estimé)" : STATUS_LABEL[status];
    html += `<div class="section-title ${status === "in_play" ? "live" : ""}">${esc(title)} · ${group.length}</div>`;
    const byComp = {};
    for (const m of group) (byComp[m.competition || "Compétition inconnue"] ??= []).push(m);
    for (const comp of Object.keys(byComp).sort()) {
      html += `<div class="comp">${esc(comp)}</div>`;
      for (const m of byComp[comp]) {
        const current = String(m.id) === String(state.selectedId);
        const diffusion = m.live_stream ? `<span class="diffusion">DIRECT</span>` : "";
        html += `<button class="row" data-id="${esc(m.id)}" aria-current="${current}">
          <span class="time">${hhmm(m.date)}</span>
          <span class="teams-stack">${teamLines(m.name)}${diffusion}</span>
          <span class="status ${esc(m.status)}">${esc(STATUS_LABEL[m.status] || "")}</span>
          <span class="chev" aria-hidden="true">›</span>
        </button>`;
      }
    }
  }
  list.innerHTML = html;
}

// Un seul écouteur pour toute la liste (au lieu d'un par ligne) : rendu plus léger.
$("list").addEventListener("click", (ev) => {
  const row = ev.target.closest(".row");
  if (!row) return;
  const match = state.matches.find(m => String(m.id) === row.dataset.id);
  state.selectedId = row.dataset.id;
  document.querySelectorAll(".row[aria-current='true']").forEach(r => r.setAttribute("aria-current", "false"));
  row.setAttribute("aria-current", "true");
  analyzeMatch(row.dataset.id, match ? match.name : "");
  startAnalysisPoll(row.dataset.id, match ? match.name : "");
});

async function analyzeMatch(id, label, { silent = false } = {}) {
  const seq = ++state.analysisSeq;
  const box = $("analysis");
  if (!silent) {
    state.analysisSig = "";
    box.innerHTML = `<div class="msg">Analyse de ${esc(label)}…</div>`;
  }
  try {
    const params = new URLSearchParams();
    if (state.market) params.set("market", state.market);
    const data = await getJson(`/api/analyze/${encodeURIComponent(id)}?${params}`);
    if (seq !== state.analysisSeq) return;
    // Mise à jour silencieuse : on ne re-rend que si les cotes ont bougé.
    const sig = JSON.stringify(data.markets);
    if (silent && sig === state.analysisSig) return;
    state.analysisSig = sig;
    state.analysisAt = new Date().toTimeString().substring(0, 8);
    const match = state.matches.find(m => String(m.id) === String(id)) || { name: label };
    const engine = await loadEngine(match, data);
    if (seq !== state.analysisSeq) return;
    renderAnalysis(match, data, engine);
  } catch (e) {
    if (seq !== state.analysisSeq) return;
    if (!silent) box.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function startAnalysisPoll(id, label) {
  clearInterval(analysisTimer);
  analysisTimer = setInterval(() => {
    if (!document.hidden && String(state.selectedId) === String(id)) analyzeMatch(id, label, { silent: true });
  }, ANALYSIS_MS);
}

// Marge du bookmaker (en %) : sous 6 % les cotes sont avantageuses, au-delà de 12 % le bookmaker prend cher.
const MARGIN_GOOD = 6;
const MARGIN_HIGH = 12;

function verdictFor(margin) {
  if (margin === null || margin === undefined) return { cls: "neutral", short: "Non évaluable", text: "marge impossible à évaluer" };
  if (margin < MARGIN_GOOD) return { cls: "good", short: "Cotes avantageuses", text: "cotes avantageuses, pari à considérer si vous aimez ce type de pari" };
  if (margin <= MARGIN_HIGH) return { cls: "mid", short: "Cotes correctes", text: "cotes correctes, jouez avec prudence" };
  return { cls: "bad", short: "Marge élevée", text: "marge élevée, le bookmaker prend cher : mieux vaut ne pas jouer ce marché" };
}

function marketLabel(name) {
  return name.replace(" (t. rég)", "");
}

function renderOverviewHtml(match, data) {
  const reliable = data.markets.filter(m => m.reliable && m.selections.length);
  const others = data.markets.filter(m => !m.reliable);
  const when = match.date ? new Date(match.date).toISOString().substring(0, 16).replace("T", " ") + " UTC" : "";

  let html = `<div class="an-head">
    <div class="an-title">${esc(match.name)}</div>
    <div class="an-meta">${esc(match.competition || "")} • ${esc(when)} • ${esc(STATUS_LABEL[match.status] || "")}</div>
    <div class="an-meta live-cotes"><span class="dot"></span> Cotes mises à jour toutes les 15 s${state.analysisAt ? " • à " + esc(state.analysisAt) : ""}</div>
  </div>`;

  if (reliable.length) {
    const best = reliable[0];
    const v = verdictFor(best.margin_pct);
    html += `<div class="an-summary ${v.cls}"><b>Conseil général :</b> ${esc(v.text)}.
      <div class="an-sub">Marché le plus avantageux parmi les fiables : ${esc(marketLabel(best.market))} (marge ${best.margin_pct.toFixed(1)} %).</div></div>`;
  } else {
    html += `<div class="an-summary neutral">Aucun marché fiable pour ce match.</div>`;
  }

  const main = reliable.find(m => m.selections.length === 3) || null;
  if (main) {
    html += `<div class="odds-tiles" style="grid-template-columns:repeat(${main.selections.length},1fr)">
      ${main.selections.map(s => `<button type="button" tabindex="-1"><span class="o-label">${esc(s.name)}</span><span class="o-value">${esc(s.odds)}</span></button>`).join("")}
    </div>`;
  }

  for (const m of reliable) {
    const v = verdictFor(m.margin_pct);
    const total = m.selections.reduce((sum, s) => sum + (s.odds > 1 ? 1 / s.odds : 0), 0);
    html += `<div class="an-card">
      <div class="an-card-head">
        <div class="an-market">${esc(marketLabel(m.market))}</div>
        <span class="an-verdict ${v.cls}">${esc(v.short)}</span>
      </div>
      <div class="an-margin">Marge du bookmaker : ${m.margin_pct.toFixed(1)} % (ce que le bookmaker garde sur ce marché)</div>`;
    for (const s of m.selections) {
      const chance = s.odds > 1 && total ? ((1 / s.odds) / total) * 100 : 0;
      html += `<div class="an-row">
        <div class="an-line"><span class="an-out">${esc(s.name)}</span><span class="an-odds">cote ${esc(s.odds)}</span></div>
        <div class="an-bar"><div style="width:${chance.toFixed(1)}%"></div></div>
        <div class="an-chances"><span>Gagner : <b>${chance.toFixed(0)} %</b></span><span>Perdre : <b>${(100 - chance).toFixed(0)} %</b></span></div>
      </div>`;
    }
    html += `</div>`;
  }

  if (others.length) {
    html += `<details class="an-more">
      <summary>Autres marchés (${others.length}) : non interprétables</summary>
      <p>Sur ces marchés, beaucoup d'issues rares existent : la marge calculée n'a pas de sens et ne doit pas servir à décider.</p>
      <ul>${others.map(m => `<li>${esc(marketLabel(m.market))} (${m.outcomes} issues)</li>`).join("")}</ul>
    </details>`;
  }

  html += `<div class="legend">Comment lire : « Gagner » est la probabilité de l'issue selon les cotes, une fois la marge du bookmaker retirée. « Perdre » est son complément. Ce n'est pas une prédiction du résultat, et parier comporte un risque de perte.</div>`;
  return html;
}

// Onglets d'analyse : chaque onglet est rendu depuis la réponse du moteur (/api/engine/match).
const AN_TABS = [
  ["overview", "Vue d'ensemble"], ["match", "Prédiction"], ["goals", "Buts & score"],
  ["corners", "Corners & cartons"], ["half", "Mi-temps"], ["odds", "Comparaison cotes"],
  ["value", "Value bets"], ["evidence", "Preuves"],
];
const NA = `<span class="na">non disponible</span>`;
const pct = (x) => (x === null || x === undefined) ? NA : `${(x * 100).toFixed(1)} %`;
const num = (x, d = 2) => (x === null || x === undefined) ? NA : Number(x).toFixed(d);
const fairOdds = (p) => (p > 0 ? (1 / p).toFixed(2) : NA);
const missingEngine = (engine) => `<div class="msg">Moteur indisponible pour ce match${engine && engine.error ? " : " + esc(engine.error) : ""}.</div>`;

function splitMatchName(name) {
  for (const sep of [" - ", " – ", " vs ", " v "]) {
    const i = name.indexOf(sep);
    if (i > 0) return [name.slice(0, i).trim(), name.slice(i + sep.length).trim()];
  }
  return null;
}

// Cotes 1X2 Betclic transmises au moteur uniquement si l'ordre domicile/nul/extérieur est vérifiable.
async function loadEngine(match, data) {
  const parts = splitMatchName(match.name || "");
  if (!parts) return { error: "nom de match non reconnu" };
  const params = new URLSearchParams({ home: parts[0], away: parts[1] });
  const main = data.markets.find(m => m.reliable && m.selections.length === 3 && m.market.startsWith("Résultat du match"));
  if (main && /nul|draw/i.test(main.selections[1].name)) {
    params.set("odds_home", main.selections[0].odds);
    params.set("odds_draw", main.selections[1].odds);
    params.set("odds_away", main.selections[2].odds);
  }
  try {
    return await getJson(`/api/engine/match?${params}`);
  } catch (e) {
    return { error: e.message };
  }
}

function renderAnalysis(match, data, engine) {
  state.an = { match, data, engine };
  const nav = AN_TABS.map(([k, l]) => `<button type="button" class="an-tab" data-tab="${k}">${esc(l)}</button>`).join("");
  $("analysis").innerHTML = `<div class="an-tabs" role="tablist">${nav}</div><div id="an-body"></div>`;
  $("analysis").querySelectorAll(".an-tab").forEach(b => b.addEventListener("click", () => showAnTab(b.dataset.tab)));
  showAnTab(state.anTab || "overview");
}

function showAnTab(key) {
  state.anTab = key;
  const { match, data, engine } = state.an;
  $("analysis").querySelectorAll(".an-tab").forEach(b => b.classList.toggle("active", b.dataset.tab === key));
  if (key === "evidence" && state.validation === undefined && !state.validationFetching) {
    state.validationFetching = true;
    getJson("/api/engine/validation")
      .then(v => { state.validation = v; })
      .catch(() => { state.validation = null; })
      .finally(() => {
        state.validationFetching = false;
        if (state.anTab === "evidence") showAnTab("evidence");
      });
  }
  $("an-body").innerHTML = AN_RENDER[key](match, data, engine);
}

const AN_RENDER = {
  overview: (match, data) => renderOverviewHtml(match, data),

  match: (match, data, engine) => {
    if (!engine || engine.error) return missingEngine(engine);
    const r = engine.markets.match_result, dc = engine.markets.double_chance, dnb = engine.markets.draw_no_bet;
    const tiles = [["Domicile", r.home], ["Nul", r.draw], ["Extérieur", r.away]]
      .map(([l, p]) => `<div class="an-tile">${l}<b>${pct(p)}</b>cote juste ${fairOdds(p)}</div>`).join("");
    return `<div class="an-summary neutral">Probabilités du modèle Dixon-Coles. Données arrêtées au ${esc(engine.data_last_match)}, qualité ${esc(engine.data_quality)}.</div>
      <div class="an-tiles" style="grid-template-columns:repeat(3,1fr)">${tiles}</div>
      <table class="an-table"><tr><th>Marché</th><th>Probabilité</th><th>Cote juste</th></tr>
        <tr><td>Double chance 1X</td><td>${pct(dc["1X"])}</td><td>${fairOdds(dc["1X"])}</td></tr>
        <tr><td>Double chance X2</td><td>${pct(dc["X2"])}</td><td>${fairOdds(dc["X2"])}</td></tr>
        <tr><td>Double chance 12</td><td>${pct(dc["12"])}</td><td>${fairOdds(dc["12"])}</td></tr>
        <tr><td>Remboursé si nul : domicile</td><td>${pct(dnb.home)}</td><td>${fairOdds(dnb.home)}</td></tr>
        <tr><td>Remboursé si nul : extérieur</td><td>${pct(dnb.away)}</td><td>${fairOdds(dnb.away)}</td></tr>
      </table>
      <div class="legend">Buts attendus : ${num(engine.expected_goals.home)} domicile, ${num(engine.expected_goals.away)} extérieur.</div>`;
  },

  goals: (match, data, engine) => {
    if (!engine || engine.error) return missingEngine(engine);
    const ou = engine.markets.over_under, tg = engine.markets.team_goals;
    const lines = Object.keys(ou).sort((a, b) => a - b)
      .map(l => `<tr><td>Plus de ${l}</td><td>${pct(ou[l].over)}</td><td>${fairOdds(ou[l].over)}</td></tr>
                 <tr><td>Moins de ${l}</td><td>${pct(ou[l].under)}</td><td>${fairOdds(ou[l].under)}</td></tr>`).join("");
    const scores = engine.markets.top_scores.slice(0, 5)
      .map(s => `<tr><td>${s.home} - ${s.away}</td><td>${pct(s.p)}</td><td>${fairOdds(s.p)}</td></tr>`).join("");
    return `<table class="an-table"><tr><th>Buts</th><th>Probabilité</th><th>Cote juste</th></tr>${lines}</table>
      <table class="an-table"><tr><th>BTTS</th><th>Probabilité</th><th>Cote juste</th></tr>
        <tr><td>Les deux marquent : oui</td><td>${pct(engine.markets.btts.yes)}</td><td>${fairOdds(engine.markets.btts.yes)}</td></tr>
        <tr><td>Les deux marquent : non</td><td>${pct(engine.markets.btts.no)}</td><td>${fairOdds(engine.markets.btts.no)}</td></tr>
      </table>
      <table class="an-table"><tr><th>Équipe</th><th>Marque</th><th>Clean sheet</th><th>Buts attendus</th></tr>
        <tr><td>Domicile</td><td>${pct(tg.home.scoring)}</td><td>${pct(tg.home.clean_sheet)}</td><td>${num(tg.home.expected)}</td></tr>
        <tr><td>Extérieur</td><td>${pct(tg.away.scoring)}</td><td>${pct(tg.away.clean_sheet)}</td><td>${num(tg.away.expected)}</td></tr>
      </table>
      <table class="an-table"><tr><th>Top 5 scores</th><th>Probabilité</th><th>Cote juste</th></tr>${scores}</table>`;
  },

  corners: (match, data, engine) => {
    if (!engine || engine.error) return missingEngine(engine);
    const block = (label, s, lines) => {
      if (!s) return `<div class="an-card"><b>${label}</b><div class="na">historique insuffisant : estimation non fournie</div></div>`;
      const ou = Object.keys(s.over_under).sort((a, b) => a - b)
        .map(l => `<tr><td>Plus de ${l}</td><td>${pct(s.over_under[l].over)}</td><td>${fairOdds(s.over_under[l].over)}</td></tr>`).join("");
      return `<div class="an-card"><b>${label}</b>
        <div class="an-margin">Attendus : domicile ${num(s.expected.home)} • extérieur ${num(s.expected.away)} • total ${num(s.expected.total)}</div>
        <table class="an-table"><tr><th>Ligne</th><th>Probabilité</th><th>Cote juste</th></tr>${ou}</table></div>`;
    };
    return block("Corners", engine.secondary.corners) + block("Cartons", engine.secondary.cards);
  },

  half: (match, data, engine) => {
    if (!engine || engine.error) return missingEngine(engine);
    const ht = engine.markets.half_time, ou = ht.over_under;
    const res = `<table class="an-table"><tr><th>Mi-temps</th><th>Probabilité</th><th>Cote juste</th></tr>
      <tr><td>Domicile</td><td>${pct(ht.result.home)}</td><td>${fairOdds(ht.result.home)}</td></tr>
      <tr><td>Nul</td><td>${pct(ht.result.draw)}</td><td>${fairOdds(ht.result.draw)}</td></tr>
      <tr><td>Extérieur</td><td>${pct(ht.result.away)}</td><td>${fairOdds(ht.result.away)}</td></tr></table>`;
    const lines = ["0.5", "1.5"].map(l => `<tr><td>Plus de ${l}</td><td>${pct(ou[l].over)}</td><td>${fairOdds(ou[l].over)}</td></tr>`).join("");
    return `${res}<table class="an-table"><tr><th>Buts 1re mi-temps</th><th>Probabilité</th><th>Cote juste</th></tr>${lines}</table>
      <div class="legend">Approximation : ${esc(ht.method)}.</div>
      <div class="an-summary neutral">Premier buteur : ${NA}. Les données de timing des buts ne sont pas disponibles.</div>`;
  },

  odds: (match, data) => {
    const rows = data.markets.filter(m => m.reliable && m.selections.length).map(m => {
      const total = m.selections.reduce((s, x) => s + (x.odds > 1 ? 1 / x.odds : 0), 0);
      return m.selections.map(s => {
        const raw = s.odds > 1 ? 1 / s.odds : null;
        const adj = raw && total ? raw / total : null;
        return `<tr><td>${esc(marketLabel(m.market))}</td><td>${esc(s.name)}</td><td>${esc(s.odds)}</td>
          <td>${pct(raw)}</td><td>${pct(adj)}</td><td>${m.margin_pct.toFixed(1)} %</td></tr>`;
      }).join("");
    }).join("");
    if (!rows) return `<div class="msg">Aucune cote fiable pour ce match.</div>`;
    return `<table class="an-table"><tr><th>Marché</th><th>Sélection</th><th>Cote</th><th>Implicite brute</th><th>Sans marge</th><th>Marge</th></tr>${rows}</table>
      <div class="legend">« Sans marge » retire la marge du bookmaker. Ce sont des probabilités du marché, pas du modèle.</div>`;
  },

  value: (match, data, engine) => {
    if (!engine || engine.error) return missingEngine(engine);
    if (!engine.value.length) return `<div class="msg">Cotes 1X2 non disponibles : aucun value bet calculable.</div>`;
    const rows = engine.value.map(v => {
      const justified = v.ev_interval[0] > 0;
      return `<tr><td>${esc(v.label)}</td><td>${esc(v.betclic_odds)}</td><td>${pct(v.implied_probability)}</td>
        <td>${pct(v.model_probability)}</td><td>${num(v.fair_odds)}</td>
        <td>${num(v.expected_value, 3)}<br><span class="na">[${num(v.ev_interval[0], 3)} ; ${num(v.ev_interval[1], 3)}]</span></td>
        <td>${num(v.confidence, 2)}</td><td>${esc(v.data_quality)}</td>
        <td>${justified ? "avantage justifié" : "pas d'avantage démontré"}</td></tr>`;
    }).join("");
    return `<table class="an-table"><tr><th>Sélection</th><th>Cote</th><th>Implicite</th><th>Modèle</th><th>Cote juste</th><th>EV [IC]</th><th>Confiance</th><th>Qualité</th><th>Verdict</th></tr>${rows}</table>
      <div class="legend">EV = probabilité × cote − 1. Un avantage n'est retenu que si la borne basse de l'intervalle est positive. La confiance mesure la fiabilité de l'estimation, pas la probabilité de gagner.</div>`;
  },

  evidence: (match, data, engine) => {
    const risks = engine && !engine.error
      ? `<ul>${engine.risks.map(r => `<li>${esc(r)}</li>`).join("")}</ul><div class="legend">${esc(engine.method)} • rho ${num(engine.rho, 3)}</div>`
      : missingEngine(engine);
    let val;
    if (state.validation === undefined) val = `<div class="msg">Chargement du rapport de validation…</div>`;
    else if (state.validation === null) val = `<div class="msg">Rapport absent : lancez <code>python scripts/validate_engine.py</code>.</div>`;
    else {
      const s = state.validation.summary, b = s.bets;
      const ci = b.roi_ci95 ? `[${pct(b.roi_ci95[0])} ; ${pct(b.roi_ci95[1])}]` : NA;
      val = `<table class="an-table"><tr><th>Walk-forward hors échantillon</th><th>Valeur</th></tr>
        <tr><td>Paris simulés</td><td>${b.count}</td></tr>
        <tr><td>ROI</td><td>${pct(b.roi)}</td></tr>
        <tr><td>IC 95 % du ROI</td><td>${ci}</td></tr>
        <tr><td>Drawdown max (unités)</td><td>${num(b.max_drawdown_units, 1)}</td></tr>
        <tr><td>CLV</td><td>${s.clv === null ? NA : esc(s.clv)}</td></tr></table>
        <div class="an-summary ${b.roi_ci95 && b.roi_ci95[0] > 0 ? "mid" : "bad"}">${esc(s.profitability_claim)}</div>`;
    }
    return `<div class="an-card"><b>Facteurs de risque</b>${risks}</div><div class="an-card"><b>Validation du modèle</b>${val}</div>`;
  },
};

// Ticker : « mis à jour il y a Xs » chaque seconde, sans toucher à la liste.
function tickAge() {
  if (!state.receivedAt) return;
  const s = Math.round((Date.now() - state.receivedAt) / 1000);
  $("ago").textContent = s < 5 ? "à l'instant" : `mis à jour il y a ${s} s`;
}

function handleData(data) {
  applyData(data);
  try { localStorage.setItem(SNAP_KEY, JSON.stringify({ key: snapKey(), data })); } catch (_) {}
  $("dot").classList.remove("off");
}

// Flux temps réel (SSE) : le serveur pousse les changements, sans requête à chaque rafraîchissement.
// Le REST reste le repli si le flux tombe.
let stream = null;
let streamOk = false;
function connectStream() {
  if (stream) stream.close();
  streamOk = false;
  const params = new URLSearchParams({ date: state.day });
  if (state.market) params.set("market", state.market);
  const es = new EventSource(`/api/stream/${encodeURIComponent(state.sport)}?${params}`);
  stream = es;
  es.addEventListener("open", () => { if (es === stream) streamOk = true; });
  es.addEventListener("data", (ev) => { if (es === stream) handleData(JSON.parse(ev.data)); });
  es.addEventListener("tick", () => { if (es === stream) state.receivedAt = Date.now(); });
  es.addEventListener("error", (ev) => {
    if (es !== stream) return;
    if (ev.data) {
      const { detail } = JSON.parse(ev.data);
      $("dot").classList.add("off");
      $("summary").insertAdjacentHTML("beforeend", `<span class="err">⚠ ${esc(detail)}</span>`);
    } else {
      streamOk = false;
    }
  });
}

function resetForNewQuery() {
  state.matches = [];
  state.signature = "";
  state.selectedId = null;
  state.analysisSeq++;
  clearInterval(analysisTimer);
  $("analysis").innerHTML = PLACEHOLDER;
  connectStream();
}

$("sports").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-sport]");
  if (!btn || btn.dataset.sport === state.sport) return;
  document.querySelectorAll("#sports button").forEach(b => b.setAttribute("aria-selected", String(b === btn)));
  state.sport = btn.dataset.sport;
  resetForNewQuery();
  refresh();
});

$("days").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button[data-day]");
  if (!btn) return;
  state.day = btn.dataset.day;
  $("day").value = state.day;
  renderDays();
  resetForNewQuery();
  refresh();
});

$("day").value = state.day;
$("day").addEventListener("change", () => {
  if (!$("day").value) return;
  state.day = $("day").value;
  renderDays();
  resetForNewQuery();
  refresh();
});

$("market").addEventListener("change", () => {
  state.market = $("market").value;
  resetForNewQuery();
  refresh();
});

$("search").addEventListener("input", () => renderList());

renderDays();
loadSnapshot();
refresh();
connectStream();
setInterval(() => { if (!document.hidden && !streamOk) refresh({ silent: true }); }, REFRESH_MS);
setInterval(tickAge, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh({ silent: true }); });
</script>
